[functions]
  directory = "netlify/functions"
  included_files = ["projects/amazon/index.html", "projects/saintpaul/index.html"]

[[redirects]]
  from = "/intro-home"
  to = "/home/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/case-unlock"
  to = "/.netlify/functions/case-unlock"
  status = 200
  force = true

[[redirects]]
  from = "/projects/amazon"
  to = "/.netlify/functions/case-gate?project=amazon"
  status = 200
  force = true

[[redirects]]
  from = "/projects/amazon/"
  to = "/.netlify/functions/case-gate?project=amazon"
  status = 200
  force = true

[[redirects]]
  from = "/projects/amazon/index.html"
  to = "/.netlify/functions/case-gate?project=amazon"
  status = 200
  force = true

[[redirects]]
  from = "/projects/saintpaul"
  to = "/.netlify/functions/case-gate?project=saintpaul"
  status = 200
  force = true

[[redirects]]
  from = "/projects/saintpaul/"
  to = "/.netlify/functions/case-gate?project=saintpaul"
  status = 200
  force = true

[[redirects]]
  from = "/projects/saintpaul/index.html"
  to = "/.netlify/functions/case-gate?project=saintpaul"
  status = 200
  force = true
