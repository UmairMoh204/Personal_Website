    <body class="projects-blueprint">
        <nav class="nav-container eco-nav">
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a class="is-active" href="./projects.html" aria-current="page">Projects</a></li>
                <li class="nav-logo-item"><img src="../logo-black.png" alt="Hamza's Portfolio Logo" class="nav-logo"></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="https://drive.google.com/file/d/1iI3A637sB-cdWAgcUygaSzReGTXzYWYu/view?usp=sharing" target="_blank" rel="noopener">Resume</a></li>

            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>

        <div class="projects-page">
            <div class="docs-glass">
            <div class="docs-editor">
                <div class="docs-menubar" role="menubar" aria-label="Blueprint menus">
                    <div class="docs-menu">
                        <button type="button" class="docs-menu__btn" data-menu="file" aria-haspopup="true" aria-expanded="false">File</button>
                        <div class="docs-menu__drop" id="menu-file" hidden>
                            <button type="button" data-action="open-case">Open case study</button>
                            <span class="docs-menu__rule"></span>
                            <button type="button" class="docs-chip" data-project="amazon" data-action="open-project">Amazon</button>
                            <button type="button" class="docs-chip" data-project="stpaul" data-action="open-project">Saint Paul</button>
                            <button type="button" class="docs-chip" data-project="tutord" data-action="open-project">TutorD</button>
                            <button type="button" class="docs-chip" data-project="doge" data-action="open-project">3DogE</button>
                        </div>
                    </div>
                    <div class="docs-menu">
                        <button type="button" class="docs-menu__btn" data-menu="view" aria-haspopup="true" aria-expanded="false">View</button>
                        <div class="docs-menu__drop" id="menu-view" hidden>
                            <button type="button" data-action="tab" data-tab="all">Full assembly</button>
                            <button type="button" data-action="tab" data-tab="research">Research</button>
                            <button type="button" data-action="tab" data-tab="synthesis">Synthesis</button>
                            <button type="button" data-action="tab" data-tab="design">Design</button>
                            <button type="button" data-action="tab" data-tab="rationale">Design Rationale</button>
                            <button type="button" data-action="tab" data-tab="product">Final Product</button>
                            <button type="button" data-action="tab" data-tab="learning">Learning &amp; Experiences</button>
                            <span class="docs-menu__rule"></span>
                            <button type="button" data-action="zoom-in">Zoom in</button>
                            <button type="button" data-action="zoom-out">Zoom out</button>
                            <button type="button" data-action="zoom-fit">Fit</button>
                        </div>
                    </div>
                    <div class="docs-menu">
                        <button type="button" class="docs-menu__btn" data-menu="insert" aria-haspopup="true" aria-expanded="false">Insert</button>
                        <div class="docs-menu__drop" id="menu-insert" hidden>
                            <p class="docs-menu__hint">Drag a project into the blueprint</p>
                            <button type="button" class="docs-chip" data-project="amazon" draggable="true">Amazon</button>
                            <button type="button" class="docs-chip" data-project="stpaul" draggable="true">Saint Paul</button>
                            <button type="button" class="docs-chip" data-project="tutord" draggable="true">TutorD</button>
                            <button type="button" class="docs-chip" data-project="doge" draggable="true">3DogE</button>
                        </div>
                    </div>
                    <div class="docs-menu">
                        <button type="button" class="docs-menu__btn" data-menu="tools" aria-haspopup="true" aria-expanded="false">Tools</button>
                        <div class="docs-menu__drop" id="menu-tools" hidden>
                            <button type="button" data-action="tab" data-tab="all">Show full assembly</button>
                            <button type="button" data-action="zoom-fit">Reset zoom</button>
                            <button type="button" data-action="open-case">Open case study</button>
                        </div>
                    </div>
                </div>

                <div class="docs-toolbar" role="toolbar" aria-label="Diagram tools">
                    <div class="docs-group" aria-label="Projects">
                        <button type="button" class="docs-chip docs-chip--bar" data-project="amazon" draggable="true">Amazon</button>
                        <button type="button" class="docs-chip docs-chip--bar" data-project="stpaul" draggable="true">Saint Paul</button>
                        <button type="button" class="docs-chip docs-chip--bar" data-project="tutord" draggable="true">TutorD</button>
                        <button type="button" class="docs-chip docs-chip--bar" data-project="doge" draggable="true">3DogE</button>
                    </div>
                    <span class="docs-sep" aria-hidden="true"></span>
                    <div class="docs-group docs-tabs" role="tablist" aria-label="Assembly phases">
                        <button type="button" class="blueprint-tab is-active" data-tab="all">All</button>
                        <button type="button" class="blueprint-tab" data-tab="research">Research</button>
                        <button type="button" class="blueprint-tab" data-tab="synthesis">Synthesis</button>
                        <button type="button" class="blueprint-tab" data-tab="design">Design</button>
                        <button type="button" class="blueprint-tab" data-tab="rationale">Rationale</button>
                        <button type="button" class="blueprint-tab" data-tab="product">Product</button>
                        <button type="button" class="blueprint-tab" data-tab="learning">Learning</button>
                    </div>
                    <span class="docs-sep" aria-hidden="true"></span>
                    <div class="docs-group docs-zoom">
                        <button type="button" class="docs-icon-btn" id="zoomOutBtn" aria-label="Zoom out">−</button>
                        <button type="button" class="docs-zoom-label" id="zoomLabel" aria-label="Zoom level">100%</button>
                        <button type="button" class="docs-icon-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
                    </div>
                </div>

                <div class="blueprint-panel" id="blueprintPanel" tabindex="0" role="region" aria-label="Project Blueprint interactive preview">
                    <div class="blueprint-empty" id="blueprintEmpty">
                        <p><strong>User Experience Assembly</strong></p>
                        <p>Drag a project from the toolbar into this box — or click a name to load its diagram.<br>Each node is a method or principle. Connections show how research becomes product.</p>
                    </div>
                    <div class="blueprint-active" id="blueprintActive" hidden>
                        <header class="blueprint-header">
                            <div class="blueprint-header-top">
                                <div>
                                    <p class="blueprint-org" id="blueprintOrg"></p>
                                    <h2 class="blueprint-title" id="blueprintTitle"></h2>
                                    <p class="blueprint-subtitle" id="blueprintSubtitle"></p>
                                    <span class="blueprint-type" id="blueprintType" hidden></span>
                                </div>
                            </div>
                        </header>
                        <div class="blueprint-body" id="blueprintBody">
                            <div class="blueprint-content" id="blueprintContent"></div>
                        </div>
                        <div class="blueprint-detail" id="blueprintDetail" hidden></div>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <script src="../web.js" type="module"></script>
        <script src="./session-check.js"></script>
        <script src="./amazon-hover-anim.js?v=67" defer></script>
        <script src="./project-blueprint.js?v=10" defer></script>
        <script src="../ia-tree.js?v=2" defer></script>
        <script src="../cursor.js" defer></script>
        <script src="../smooth-scroll.js" defer></script>
